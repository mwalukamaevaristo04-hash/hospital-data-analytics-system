<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Patient Registration
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        /* =====================================================
           PATIENT REGISTRATION PAGE
           Page-specific styling only
        ===================================================== */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body.registration-page {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .registration-header {
            width: 100%;
            box-sizing: border-box;

            background: #0f3d56;
            color: white;

            padding: 20px 40px;

            display: flex;
            flex-direction: column;

            align-items: flex-start;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .registration-header .header-title {
            font-size: 25px;
            font-weight: bold;

            margin: 0;
        }

        .registration-header .header-subtitle {
            font-size: 14px;

            margin-top: 5px;

            opacity: 0.9;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .registration-container {
            width: 100%;
            max-width: 850px;

            margin: 35px auto 50px;

            padding: 0 20px;

            box-sizing: border-box;
        }


        /* =====================================================
           REGISTRATION CARD
        ===================================================== */

        .registration-card {
            width: 100%;

            box-sizing: border-box;

            background: white;

            padding: 30px 40px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.10);
        }

        .registration-card h2 {
            margin-top: 0;
            margin-bottom: 8px;

            text-align: center;

            color: #1f4e79;

            font-size: 25px;
        }

        .registration-card > p {
            text-align: center;

            color: #666;

            margin-top: 0;
            margin-bottom: 28px;
        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        .registration-alert {
            padding: 12px 15px;

            margin-bottom: 20px;

            border-radius: 6px;

            background: #f8d7da;

            color: #842029;

            border: 1px solid #f5c2c7;

            font-weight: bold;
        }


        /* =====================================================
           FORM GRID
        ===================================================== */

        .registration-form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px 25px;
        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .registration-form-group {
            display: flex;

            flex-direction: column;
        }

        .registration-form-group label {
            margin-bottom: 7px;

            color: #333;

            font-weight: bold;

            font-size: 14px;
        }

        .registration-form-group input,
        .registration-form-group select {
            width: 100%;

            box-sizing: border-box;

            height: 44px;

            padding: 10px 12px;

            border: 1px solid #cbd5dc;

            border-radius: 6px;

            background: white;

            color: #222;

            font-size: 14px;
        }

        .registration-form-group input:focus,
        .registration-form-group select:focus {
            outline: none;

            border-color: #1f4e79;

            box-shadow:
                0 0 0 2px rgba(31, 78, 121, 0.12);
        }


        /* =====================================================
           FORM ACTIONS
        ===================================================== */

        .registration-form-actions {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 8px;

            margin-top: 30px;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .registration-btn {
            display: inline-block;

            padding: 10px 18px;

            border: none;

            border-radius: 6px;

            font-size: 14px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            box-sizing: border-box;
        }

        .registration-btn-primary {
            background: #1f4e79;

            color: white;
        }

        .registration-btn-primary:hover {
            background: #163a5c;
        }

        .registration-btn-secondary {
            background: transparent;

            color: #1769c2;
        }

        .registration-btn-secondary:hover {
            background: #eef4f8;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .registration-header {
                padding: 18px 25px;
            }

            .registration-header .header-title {
                font-size: 21px;
            }

            .registration-container {
                margin-top: 25px;

                padding: 0 15px;
            }

            .registration-card {
                padding: 25px 20px;
            }

            .registration-form-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 450px) {

            .registration-header {
                padding: 16px 18px;
            }

            .registration-header .header-title {
                font-size: 19px;
            }

            .registration-card {
                padding: 22px 15px;
            }

            .registration-form-actions {
                flex-direction: column;
            }

            .registration-btn {
                width: 100%;

                text-align: center;
            }

        }

    </style>

</head>


<body class="registration-page">


<!-- =========================================================
     HEADER
========================================================= -->

<header class="registration-header">

    <div class="header-title">
        🏥 Hospital Data Analytics System
    </div>

    <div class="header-subtitle">
        Patient Self Registration
    </div>

</header>


<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<main class="registration-container">


    <section class="registration-card">

        <h2>
            Patient Registration
        </h2>

        <p>
            Create your patient account to access hospital services.
        </p>


        {% if error %}

        <div class="registration-alert">
            {{ error }}
        </div>

        {% endif %}


        <!-- =================================================
             REGISTRATION FORM
        ================================================== -->

        <form
            action="{{ url_for('patient_register') }}"
            method="POST"
        >

            <div class="registration-form-grid">


                <!-- FULL NAME -->

                <div class="registration-form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        required
                    >

                </div>


                <!-- AGE -->

                <div class="registration-form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="0"
                        max="120"
                        required
                    >

                </div>


                <!-- GENDER -->

                <div class="registration-form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- PHONE -->

                <div class="registration-form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="06XXXXXXXX or 07XXXXXXXX"
                        required
                    >

                </div>


                <!-- ADDRESS -->

                <div class="registration-form-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        required
                    >

                </div>


                <!-- USERNAME -->

                <div class="registration-form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="registration-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="registration-form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        minlength="6"
                        required
                    >

                </div>


            </div>


            <!-- =================================================
                 FORM BUTTONS
            ================================================== -->

            <div class="registration-form-actions">

                <button
                    type="submit"
                    class="registration-btn registration-btn-primary"
                >
                    Create Patient Account
                </button>


                <a
                    href="{{ url_for('login') }}"
                    class="registration-btn registration-btn-secondary"
                >
                    Back to Login
                </a>

            </div>

        </form>

    </section>


</main>


</body>

</html>
