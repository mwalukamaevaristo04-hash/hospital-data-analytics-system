<!DOCTYPE html>
<html>
<head>
    <title>Edit Doctor - Hospital Data Analytics System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Edit Doctor</h1>

    <h2>Update Doctor Information</h2>

    <form method="POST">

        <label>Full Name:</label><br>
        <input type="text"
               name="full_name"
               value="{{ doctor['full_name'] }}"
               required>
        <br><br>

        <label>Gender:</label><br>

        <select name="gender" required>

            <option value="Male"
                {% if doctor['gender'] == 'Male' %}selected{% endif %}>
                Male
            </option>

            <option value="Female"
                {% if doctor['gender'] == 'Female' %}selected{% endif %}>
                Female
            </option>

        </select>

        <br><br>

        <label>Specialization:</label><br>
        <input type="text"
               name="specialization"
               value="{{ doctor['specialization'] }}"
               required>
        <br><br>

        <label>Phone Number:</label><br>
        <input type="text"
               name="phone"
               value="{{ doctor['phone'] }}">
        <br><br>

        <label>Email:</label><br>
        <input type="email"
               name="email"
               value="{{ doctor['email'] }}">
        <br><br>

        <label>Department:</label><br>
        <input type="text"
               name="department"
               value="{{ doctor['department'] }}">
        <br><br>

        <button type="submit">
            Update Doctor
        </button>

    </form>

    <br>

    <a href="/doctors">
        Cancel
    </a>

</body>
</html>
